name: FalixNodes-25m-Scheduler

on:
  workflow_run:
    workflows:
      - "FalixNodes-Keep-Server-Running"
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: falixnodes-25m-scheduler
  cancel-in-progress: true

jobs:
  wait-and-trigger:
    runs-on: ubuntu-latest

    # 这里使用我们设置了 25 分钟等待的 Environment
    environment:
      name: falix-wait-25m

    steps:
      - name: Trigger next FalixNodes run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "25 minutes passed. Triggering next FalixNodes run..."

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/falixnodes.yml/dispatches" \
            --data '{"ref":"main"}'

          echo "Next FalixNodes run dispatched."
